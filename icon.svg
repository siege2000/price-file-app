<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <!-- Dark indigo background gradient, matching RxOne navy/purple -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1740"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <!-- Subtle shimmer on document -->
    <linearGradient id="docShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e8eaf6" stop-opacity="1"/>
    </linearGradient>
    <!-- Gold gradient for badge -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Drop shadow for document -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ── Background rounded square ── -->
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- ── Subtle sparkle dots (echoing the RxOne logo background) ── -->
  <circle cx="30"  cy="40"  r="1.5" fill="white" opacity="0.25"/>
  <circle cx="220" cy="30"  r="1"   fill="white" opacity="0.2"/>
  <circle cx="240" cy="80"  r="1.5" fill="white" opacity="0.2"/>
  <circle cx="20"  cy="200" r="1"   fill="white" opacity="0.2"/>
  <circle cx="50"  cy="220" r="1.5" fill="white" opacity="0.25"/>
  <circle cx="210" cy="210" r="1"   fill="white" opacity="0.15"/>

  <!-- ── Document / price file (white, slightly tilted for depth) ── -->
  <g filter="url(#shadow)">
    <!-- Back page (slight offset) -->
    <rect x="72" y="48" width="108" height="142" rx="10" fill="#c5cae9" opacity="0.6" transform="rotate(3,126,119)"/>
    <!-- Main document -->
    <rect x="62" y="44" width="108" height="142" rx="10" fill="url(#docShine)"/>
    <!-- Dog-ear fold top-right -->
    <polygon points="146,44 170,44 170,68" fill="#c7d2fe"/>
    <polygon points="146,44 170,68 146,68" fill="#e8eaf6"/>
  </g>

  <!-- ── Document header bar (indigo, like a spreadsheet header row) ── -->
  <rect x="62" y="44" width="108" height="30" rx="10" fill="#312e81"/>
  <rect x="62" y="60" width="108" height="14" fill="#312e81"/>
  <!-- "P$" monogram in header -->
  <text x="116" y="67" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="-1">P$</text>

  <!-- ── Price file rows (suggesting tabular data) ── -->
  <!-- Row dividers -->
  <line x1="62"  y1="104" x2="170" y2="104" stroke="#e8eaf6" stroke-width="1.5"/>
  <line x1="62"  y1="122" x2="170" y2="122" stroke="#e8eaf6" stroke-width="1.5"/>
  <line x1="62"  y1="140" x2="170" y2="140" stroke="#e8eaf6" stroke-width="1.5"/>
  <line x1="62"  y1="158" x2="170" y2="158" stroke="#e8eaf6" stroke-width="1.5"/>
  <!-- Column divider -->
  <line x1="130" y1="74" x2="130" y2="175" stroke="#e8eaf6" stroke-width="1.5"/>

  <!-- Left column pills (description / product name) -->
  <rect x="70" y="90"  width="50" height="9" rx="4" fill="#c5cae9"/>
  <rect x="70" y="108" width="44" height="9" rx="4" fill="#c5cae9"/>
  <rect x="70" y="126" width="52" height="9" rx="4" fill="#c5cae9"/>
  <rect x="70" y="144" width="40" height="9" rx="4" fill="#c5cae9"/>
  <rect x="70" y="162" width="48" height="9" rx="4" fill="#c5cae9"/>

  <!-- Right column pills (prices — some gold to suggest currency) -->
  <rect x="136" y="90"  width="26" height="9" rx="4" fill="#fde68a"/>
  <rect x="136" y="108" width="26" height="9" rx="4" fill="#fde68a"/>
  <rect x="136" y="126" width="26" height="9" rx="4" fill="#fde68a"/>
  <rect x="136" y="144" width="26" height="9" rx="4" fill="#fde68a"/>
  <rect x="136" y="162" width="26" height="9" rx="4" fill="#fde68a"/>

  <!-- ── Gold action badge (bottom-right) — upload/process arrow ── -->
  <!-- Outer ring -->
  <circle cx="186" cy="186" r="46" fill="#1a1740" opacity="0.5"/>
  <!-- Gold circle -->
  <circle cx="186" cy="186" r="40" fill="url(#gold)"/>
  <!-- Upward arrow (representing the upsert/upload to database) -->
  <line x1="186" y1="205" x2="186" y2="169" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <polyline points="170,183 186,167 202,183" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Small horizontal base line (database shelf) -->
  <line x1="173" y1="205" x2="199" y2="205" stroke="white" stroke-width="5" stroke-linecap="round"/>
</svg>
